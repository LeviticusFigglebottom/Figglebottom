name: Originality guard
# main only: every session runs tools/check_originality.sh before each commit
on:
  workflow_dispatch:
  push:
    branches: ["main"]
jobs:
  banned-terms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Grep for banned source / other-game terms
        run: tools/check_originality.sh
