name: CI — test and export

# Imports the project, runs the headless test suite (tools/test.sh: static
# area audits + in-engine tests), then packages standalone Linux and Windows
# builds. Grab the builds from the run's Artifacts.
on:
  workflow_dispatch:
  push:
    branches: ["main", "feat/**", "fix/**", "art/**", "claude/**"]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:

env:
  GODOT_VERSION: "4.7"

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot + export templates
        run: |
          set -e
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project resources
        run: godot --headless --path . --import 2>&1 | tail -2 || true

      - name: Run tests
        run: tools/test.sh

      - name: Export Linux
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Linux" build/rimeholt-linux.x86_64 2>&1 | tail -3
          test -f build/rimeholt-linux.x86_64

      - name: Export Windows
        run: |
          godot --headless --path . --export-release "Windows" build/rimeholt-windows.exe 2>&1 | tail -3
          test -f build/rimeholt-windows.exe

      - name: Upload Linux build
        # builds are kept for main only, and briefly: branch runs filled the artifact quota
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: rimeholt-linux
          path: build/rimeholt-linux.x86_64

      - name: Upload Windows build
        # builds are kept for main only, and briefly: branch runs filled the artifact quota
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: rimeholt-windows
          path: build/rimeholt-windows.exe

  # The full-game region walks (tools/test/fullgame_<region>_test.gd): each
  # plays one whole region with a steered Bearer, from the save the previous
  # region's walk ends on. A quarter of an hour apiece, so one job per region.
  fullgame:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        region: [lowe, kettle, tarnhall, thornwold, coldwell, ending_outsong, ending_kept]
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          set -e
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Import project resources
        run: godot --headless --path . --import 2>&1 | tail -2 || true

      - name: Walk the region
        run: |
          test -f "tools/test/fullgame_${{ matrix.region }}_test.tscn" || { echo "no suite yet"; exit 0; }
          tools/test.sh "fullgame_${{ matrix.region }}"
