name: Build — Windows, Linux and macOS

# Packages playable builds of main without waiting on the test suite (tests stay
# in ci.yml), checks each one starts on its own OS, and publishes them as a
# GitHub Release: Windows .zip, Linux .tar.gz, macOS .dmg (Apple silicon and Intel).
# Latest: https://github.com/<owner>/<repo>/releases/latest
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore: ["docs/**", "*.md"]

concurrency:
  group: export-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # three ~1.7 GB exports plus their archives need room the runner lacks by default
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h .

      - name: Install Godot + export templates
        run: |
          set -e
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz && rm templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project resources
        # twice: one headless pass can exit before every model's textures are extracted,
        # which exports a build with stand-in models
        run: |
          godot --headless --path . --import 2>&1 | tail -2 || true
          godot --headless --path . --import 2>&1 | tail -2 || true
          echo "imported files: $(ls .godot/imported | wc -l)"

      - name: Name the build
        id: tag
        run: echo "tag=build-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Export Windows
        run: |
          mkdir -p build/Rimeholt-windows dist
          godot --headless --path . --export-release "Windows" build/Rimeholt-windows/Rimeholt.exe 2>&1 | tail -3
          test -f build/Rimeholt-windows/Rimeholt.exe
          (cd build && zip -q -r -1 ../dist/Rimeholt-windows.zip Rimeholt-windows)
          rm -rf build/Rimeholt-windows

      - name: Export Linux, and check it starts
        run: |
          mkdir -p build/Rimeholt-linux
          godot --headless --path . --export-release "Linux" build/Rimeholt-linux/Rimeholt.x86_64 2>&1 | tail -3
          chmod +x build/Rimeholt-linux/Rimeholt.x86_64
          # boot to the title with no window, then quit
          timeout 300 build/Rimeholt-linux/Rimeholt.x86_64 --headless --quit-after 600 > linux_boot.log 2>&1 || true
          tail -5 linux_boot.log
          if grep -E "SCRIPT ERROR|Couldn't load project data|Error loading" linux_boot.log; then exit 1; fi
          tar -C build -czf dist/Rimeholt-linux.tar.gz Rimeholt-linux
          rm -rf build/Rimeholt-linux

      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/Rimeholt-windows.zip, retention-days: 3, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/Rimeholt-linux.tar.gz, retention-days: 3, compression-level: 0 }

  macos-export:
    # its own runner: Apple silicon needs ETC2/ASTC textures, imported here only, so
    # nobody's working copy (and the Windows/Linux builds) carry a second texture set
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h .

      - name: Install Godot + export templates
        run: |
          set -e
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz && rm templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import, with ETC2/ASTC for Apple silicon
        run: |
          sed -i 's|^\[rendering\]$|[rendering]\ntextures/vram_compression/import_etc2_astc=true|' project.godot
          grep -n import_etc2_astc project.godot
          godot --headless --path . --import 2>&1 | tail -2 || true
          godot --headless --path . --import 2>&1 | tail -2 || true
          echo "imported files: $(ls .godot/imported | wc -l)"

      - name: Export macOS (Apple silicon and Intel)
        run: |
          set -o pipefail
          mkdir -p dist
          godot --headless --path . --export-release "macOS Apple silicon" dist/Rimeholt-macos-apple-silicon.zip 2>&1 | grep -v "^ *at:" | grep -iE "error|warn" | head -20 || true
          godot --headless --path . --export-release "macOS Intel" dist/Rimeholt-macos-intel.zip 2>&1 | grep -v "^ *at:" | grep -iE "error|warn" | head -20 || true
          ls -la dist
          test -f dist/Rimeholt-macos-apple-silicon.zip && test -f dist/Rimeholt-macos-intel.zip

      - uses: actions/upload-artifact@v4
        with: { name: macos-zips, path: dist/*.zip, retention-days: 1, compression-level: 0 }

  windows-check:
    needs: export
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with: { name: windows }
      - name: Check it starts
        shell: pwsh
        run: |
          Expand-Archive Rimeholt-windows.zip -DestinationPath .
          $p = Start-Process -FilePath "Rimeholt-windows\Rimeholt.exe" -ArgumentList "--headless","--quit-after","600" `
               -RedirectStandardOutput boot.log -RedirectStandardError boot_err.log -PassThru -Wait
          Get-Content boot.log -Tail 5; Get-Content boot_err.log -Tail 5
          if (Select-String -Path boot.log,boot_err.log -Pattern "SCRIPT ERROR|Couldn't load project data") { exit 1 }
          "exit code $($p.ExitCode)"

  macos-dmg:
    needs: macos-export
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with: { name: macos-zips }
      - name: Sign (ad hoc), check each starts, make the .dmg files
        run: |
          set -e
          for kind in apple-silicon intel; do
            rm -rf app dmg; ditto -x -k "Rimeholt-macos-$kind.zip" app
            APP="$(ls -d app/*.app | head -1)"
            # Apple silicon will not run an unsigned app at all; an ad-hoc signature lets it open
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep --strict "$APP"
            BIN="$APP/Contents/MacOS/$(ls "$APP/Contents/MacOS" | head -1)"
            RUN=""
            if [ "$kind" = intel ]; then
              if arch -x86_64 /usr/bin/true 2>/dev/null; then RUN="arch -x86_64"; else echo "no Rosetta on this runner: Intel build not started"; BIN=""; fi
            fi
            if [ -n "$BIN" ]; then
              ( $RUN "$BIN" --headless --quit-after 600 > boot-$kind.log 2>&1 ) || true
              tail -5 boot-$kind.log
              if grep -E "SCRIPT ERROR|Couldn't load project data" boot-$kind.log; then exit 1; fi
            fi
            mkdir dmg && mv "$APP" dmg/Rimeholt.app && ln -s /Applications dmg/Applications
            hdiutil create -volname Rimeholt -srcfolder dmg -ov -format UDZO "Rimeholt-macos-$kind.dmg"
          done
          ls -la *.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: "*.dmg", retention-days: 3, compression-level: 0 }

  release:
    needs: [export, windows-check, macos-dmg]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.export.outputs.tag }}
        run: |
          rm -f dist/Rimeholt-macos-*.zip   # unsigned intermediates; the .dmg files are the macOS builds
          ls -la dist
          cat > notes.md <<EOF
          Playable build of main at ${GITHUB_SHA::7}. Not tested beyond starting up; see the CI run for test results.

          - **Windows:** unzip \`Rimeholt-windows.zip\`, run \`Rimeholt.exe\`. If SmartScreen warns, choose *More info → Run anyway*.
          - **Linux:** \`tar xzf Rimeholt-linux.tar.gz\`, then run \`Rimeholt-linux/Rimeholt.x86_64\`.
          - **macOS:** \`Rimeholt-macos-apple-silicon.dmg\` for M1 and later, \`Rimeholt-macos-intel.dmg\` for Intel Macs. Open it, drag Rimeholt to Applications. The app is not notarized, so the first time, right-click it and choose *Open* (or run \`xattr -dr com.apple.quarantine /Applications/Rimeholt.app\`).
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Rimeholt $TAG" --notes-file notes.md --latest
